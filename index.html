<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso interno | Cortez Móveis</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/marketing-pixel/SITE/main/assets/Logo.png" alt="Cortez Móveis">
      <div class="brand-copy">
        <strong>ACESSO INTERNO</strong>
        <span>Controle de Relatórios</span>
      </div>
    </div>
    <div class="internal-badge">Área restrita</div>
  </header>

  <section class="login" id="internalLogin">
    <div class="login-card">
      <div class="login-mark">C</div>
      <h1>Acesso interno</h1>
      <p>Entre com o acesso administrativo da Cortez Móveis para abrir o <strong>Controle de relatórios</strong>.</p>

      <form id="loginForm">
        <label class="field">
          E-mail
          <input id="loginEmail" type="email" autocomplete="username" placeholder="seu e-mail corporativo" required>
        </label>

        <label class="field">
          Senha
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>

        <div id="loginMessage" class="notice"></div>

        <div class="actions">
          <button class="btn primary" id="loginButton" type="submit">Acessar controle</button>
        </div>
      </form>
    </div>
  </section>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://kvxmnbkfscpqnbftqjeu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Mx-i_T4xREFQuinN-aq3lA_f3jMTFc5";
  const client = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById("loginForm");
  const emailInput = document.getElementById("loginEmail");
  const passwordInput = document.getElementById("loginPassword");
  const message = document.getElementById("loginMessage");
  const button = document.getElementById("loginButton");

  const showMessage = (text, error = true) => {
    message.textContent = text;
    message.className = "notice show " + (error ? "error" : "success");
  };

  const goToControl = () => {
    sessionStorage.setItem("cortez_internal_login", "1");
    window.location.replace("./controle.html");
  };

  async function init() {
    if (!client) {
      showMessage("Não foi possível carregar o sistema de autenticação. Atualize a página e tente novamente.");
      return;
    }

    const token = new URLSearchParams(window.location.search).get("token");
    if (token) {
      const publicUrl = new URL("./cliente.html", window.location.href);
      publicUrl.search = new URLSearchParams({ token: token.trim() }).toString();
      publicUrl.hash = "";
      window.location.replace(publicUrl.href);
      return;
    }

    try {
      const { data } = await client.auth.getSession();
      if (data?.session) goToControl();
    } catch {
      // A tela de login continua disponível mesmo se a sessão não puder ser lida.
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!client) {
      showMessage("Sistema de autenticação indisponível neste momento.");
      return;
    }

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    button.disabled = true;
    button.textContent = "Entrando…";
    message.className = "notice";

    try {
      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        const detail = error.message || "Não foi possível entrar.";
        showMessage(detail);
        return;
      }

      if (!data?.session) {
        showMessage("Login concluído, mas a sessão não foi criada. Tente novamente.");
        return;
      }

      showMessage("Acesso autorizado. Abrindo o controle…", false);
      goToControl();
    } catch (error) {
      showMessage(error?.message || "Falha de comunicação com o servidor de autenticação.");
    } finally {
      button.disabled = false;
      button.textContent = "Acessar controle";
    }
  });

  init();
})();
</script>
</body>
</html>
