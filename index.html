<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso interno | Cortez Móveis</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/marketing-pixel/SITE/main/assets/Logo.png" alt="Cortez Móveis">
      <div class="brand-copy">
        <strong>ACESSO INTERNO</strong>
        <span>Controle de Relatórios</span>
      </div>
    </div>
    <div class="internal-badge">Área restrita</div>
  </header>

  <section class="login" id="internalLogin">
    <div class="login-card">
      <div class="login-mark">C</div>
      <h1>Acesso interno</h1>
      <p>Entre com o acesso administrativo da Cortez Móveis para abrir o <strong>Controle de relatórios</strong>.</p>

      <form id="loginForm">
        <label class="field">
          E-mail
          <input id="loginEmail" type="email" autocomplete="username" placeholder="seu e-mail corporativo" required>
        </label>

        <label class="field">
          Senha
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>

        <div id="loginMessage" class="notice"></div>

        <div class="actions">
          <button class="btn primary" id="loginButton" type="submit">Acessar controle</button>
        </div>
      </form>
    </div>
  </section>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://kvxmnbkfscpqnbftqjeu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Mx-i_T4xREFQuinN-aq3lA_f3jMTFc5";

  const form = document.getElementById("loginForm");
  const emailInput = document.getElementById("loginEmail");
  const passwordInput = document.getElementById("loginPassword");
  const message = document.getElementById("loginMessage");
  const button = document.getElementById("loginButton");

  function showMessage(text, error = true) {
    message.textContent = text;
    message.className = "notice show " + (error ? "error" : "success");
  }

  function redirectToControl(session) {
    sessionStorage.setItem("cortez_auth_session", JSON.stringify({
      access_token: session.access_token,
      refresh_token: session.refresh_token
    }));
    window.location.href = "./controle.html";
  }

  async function init() {
    const token = new URLSearchParams(window.location.search).get("token");
    if (token) {
      const publicUrl = new URL("./cliente.html", window.location.href);
      publicUrl.search = new URLSearchParams({ token: token.trim() }).toString();
      publicUrl.hash = "";
      window.location.replace(publicUrl.href);
      return;
    }

    try {
      const saved = sessionStorage.getItem("cortez_auth_session");
      if (!saved) return;
      const parsed = JSON.parse(saved);
      if (parsed?.access_token && parsed?.refresh_token) {
        window.location.replace("./controle.html");
      }
    } catch {
      sessionStorage.removeItem("cortez_auth_session");
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    button.disabled = true;
    button.textContent = "Entrando…";
    message.className = "notice";

    try {
      const response = await fetch(
        SUPABASE_URL + "/auth/v1/token?grant_type=password",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({ email, password })
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        showMessage(data.error_description || data.msg || data.message || "Não foi possível entrar.");
        return;
      }

      if (!data.access_token || !data.refresh_token) {
        showMessage("O servidor autenticou o acesso, mas não retornou uma sessão válida.");
        return;
      }

      showMessage("Acesso autorizado. Abrindo o controle…", false);
      redirectToControl(data);
    } catch (error) {
      showMessage(error?.message || "Falha de comunicação com o servidor de autenticação.");
    } finally {
      button.disabled = false;
      button.textContent = "Acessar controle";
    }
  });

  init();
})();
</script>
</body>
</html>
